<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090a0d" />
  <title>Mini Game | Alex.dev</title>
  <link href="assets/fonts/fonts.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind-index.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #090a0d;
      --line: rgba(255, 255, 255, 0.08);
      --cyan: #00f2fe;
    }
    body {
      min-height: 100vh;
      margin: 0;
      color: #e2e8f0;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(0, 242, 254, 0.09), transparent 38rem),
        radial-gradient(ellipse at 92% 72%, rgba(16, 185, 129, 0.06), transparent 32rem),
        var(--page-bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html.light {
      color-scheme: light;
    }
    html.light body {
      background:
        radial-gradient(ellipse at 50% 18%, rgba(14, 165, 233, 0.10), transparent 38rem),
        radial-gradient(ellipse at 92% 72%, rgba(16, 185, 129, 0.08), transparent 32rem),
        #f3f7fb !important;
      color: #0f172a !important;
    }
    html.light header {
      background: rgba(255, 255, 255, 0.78) !important;
      border-color: rgba(15, 23, 42, 0.1) !important;
    }
    html.light .text-white,
    html.light .text-gray-300,
    html.light .text-gray-400,
    html.light .text-gray-500,
    html.light .text-gray-600,
    html.light .text-gray-700,
    html.light h1,
    html.light h2,
    html.light p,
    html.light span {
      color: #0f172a !important;
    }
    html.light .game-shell,
    html.light .game-toolbar {
      background: rgba(255, 255, 255, 0.9) !important;
      border-color: rgba(15, 23, 42, 0.12) !important;
      color: #0f172a !important;
      box-shadow: 0 20px 60px -35px rgba(14, 116, 144, 0.22) !important;
    }
    html.light .control-button {
      background: rgba(15, 23, 42, 0.04) !important;
      border-color: rgba(15, 23, 42, 0.12) !important;
      color: #0f172a !important;
    }
    html.light #game-navigation {
      background: rgba(255, 255, 255, 0.75) !important;
      border-color: rgba(15, 23, 42, 0.08) !important;
    }
    html.light #game-navigation a,
    html.light #game-back-link {
      color: #334155 !important;
    }
    html.light #game-back-link {
      background: rgba(15, 23, 42, 0.04) !important;
      border-color: rgba(15, 23, 42, 0.08) !important;
    }
    .game-shell {
      height: min(76svh, 820px);
      min-height: 520px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(20, 24, 30, 0.9), rgba(9, 10, 13, 0.96));
      box-shadow: 0 30px 100px -50px rgba(0, 242, 254, 0.36), 0 24px 80px rgba(0, 0, 0, 0.44);
    }
    .game-toolbar {
      min-height: 60px;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 19, 24, 0.94);
    }
    .game-stage {
      min-height: 0;
      flex: 1;
      background: #2b5c8f;
    }
    .game-stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .game-shell:fullscreen {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      border: 0;
      border-radius: 0;
      background: #090a0d;
    }
    .game-shell:fullscreen .game-toolbar {
      flex: 0 0 auto;
    }
    .game-shell:fullscreen .game-stage {
      flex: 1;
    }
    .game-shell:fullscreen .game-stage iframe {
      height: 100%;
    }
    .leaderboard-panel {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.1);
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
    }
    .leaderboard-header {
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
      padding: 0.9rem 1rem;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.62rem;
      line-height: 1.6;
    }
    .leaderboard-table th,
    .leaderboard-table td {
      padding: 0.75rem 0.8rem;
      text-align: left;
      border-bottom: 1px dashed #cbd5e1;
    }
    .leaderboard-table th {
      color: #475569;
      letter-spacing: 1px;
      font-weight: 400;
      text-transform: uppercase;
    }
    .leaderboard-table td {
      color: #111827;
      font-variant-numeric: tabular-nums;
    }
    .leaderboard-table tr:last-child td {
      border-bottom: 0;
    }
    .leaderboard-header p {
      color: #0891b2;
    }
    .leaderboard-header h2 {
      color: #111827;
    }
    html.dark .leaderboard-panel {
      border: 2px solid #00ffff;
      background: rgba(0, 0, 0, 0.8);
      box-shadow: 4px 4px 0 #ff3366;
    }
    html.dark .leaderboard-header {
      border-bottom: 2px solid rgba(255, 255, 255, 0.22);
      background: rgba(14, 17, 22, 0.96);
    }
    html.dark .leaderboard-header h2,
    html.dark .leaderboard-table td {
      color: #fff;
    }
    html.dark .leaderboard-table th {
      color: #00ffff;
    }
    html.dark .leaderboard-table th,
    html.dark .leaderboard-table td {
      border-color: rgba(255, 255, 255, 0.18);
    }
    .control-button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.045);
      padding: 0 12px;
      color: #d1d5db;
      font: 500 12px/1 Inter, sans-serif;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    .control-button:hover {
      border-color: rgba(0, 242, 254, 0.36);
      background: rgba(0, 242, 254, 0.08);
      color: white;
    }
    @media (max-width: 640px) {
      .game-shell {
        height: 70svh;
        min-height: 440px;
        border-radius: 12px;
      }
      .game-toolbar {
        min-height: 54px;
      }
      .control-label {
        display: none;
      }
    }
    @media (max-width: 639px) {
      #game-navigation {
        display: flex;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        justify-content: center;
        border-top: 0;
        border-radius: 0 0 14px 14px;
        padding: 6px 12px;
        background: rgba(9, 10, 13, 0.96);
      }
      #game-navigation a { min-height: 40px; padding-inline: 16px; }
      #game-back-link { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body class="antialiased">
  <header class="fixed inset-x-0 top-0 z-20 border-b border-white/[0.06] bg-[#090a0d]/80 backdrop-blur-2xl">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-5 sm:px-8">
      <a class="flex items-center gap-3 text-white" href="index.html" aria-label="Alex.dev Startseite">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl border border-white/10 bg-white/[0.04] font-mono text-xs font-semibold text-[#00f2fe]">&lt;/&gt;</span>
        <span class="text-base font-semibold">Alex<span class="font-mono text-xs text-[#00f2fe]">.dev</span></span>
      </a>
      <nav id="game-navigation" class="hidden items-center gap-1 rounded-full border border-white/[0.08] bg-white/[0.04] p-1 sm:flex" aria-label="Main navigation">
        <a class="whitespace-nowrap rounded-full px-4 py-2 text-xs text-gray-400 transition-all duration-200 hover:bg-white/[0.06] hover:text-white" href="index.html">Overview</a>
        <a class="whitespace-nowrap rounded-full bg-white/[0.12] px-4 py-2 text-xs font-medium text-white shadow-sm transition-all duration-200" href="mini-game.html" aria-current="page">Mini Game</a>
      </nav>
      <div class="flex items-center gap-2">
        <a aria-label="GitHub Profile" class="inline-flex items-center justify-center rounded-full border border-white/[0.1] bg-white/[0.04] p-2 text-gray-300 transition-colors hover:border-[#00f2fe]/40 hover:text-white" href="https://github.com/alexchen-dev" rel="noreferrer" target="_blank">
          <span class="material-symbols-outlined text-[17px]" aria-hidden="true">terminal</span>
        </a>
        <button aria-label="Toggle Theme" class="inline-flex items-center justify-center rounded-full border border-white/[0.1] bg-white/[0.04] p-2 text-gray-300 transition-colors hover:border-[#00f2fe]/40 hover:text-white" id="mini-theme-toggle" type="button">
          <span class="material-symbols-outlined text-[17px]" aria-hidden="true">dark_mode</span>
        </button>
        <a id="game-back-link" class="inline-flex items-center gap-2 rounded-full border border-white/[0.1] bg-white/[0.04] px-3 py-2 text-xs text-gray-300 transition-colors hover:border-[#00f2fe]/40 hover:text-white" href="index.html">
          <span class="material-symbols-outlined text-[17px]" aria-hidden="true">arrow_back</span>
          <span class="hidden sm:inline">Zur Startseite</span>
          <span class="sm:hidden">Zurück</span>
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl px-4 pb-8 pt-32 sm:px-8 sm:pt-28">
    <section class="mb-5 flex flex-col justify-between gap-4 sm:mb-7 sm:flex-row sm:items-end">
      <div>
        <p class="mb-2 font-mono text-[10px] font-medium uppercase tracking-[0.18em] text-[#00f2fe]">Interactive Lab / 01</p>
        <h1 class="text-2xl font-semibold tracking-tight text-white sm:text-3xl">Pixel Protocol <span class="text-gray-500">198X</span></h1>
      </div>
      <div class="flex items-center gap-2 text-xs text-gray-400">
        <span class="relative flex h-2 w-2"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-40"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"></span></span>
        Game ready
      </div>
    </section>

    <section class="game-shell flex flex-col" id="game-shell" aria-label="Pixel Protocol game player">
      <div class="game-toolbar flex shrink-0 items-center justify-between gap-3 px-3 sm:px-5">
        <div class="flex min-w-0 items-center gap-3">
          <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-[#00f2fe]/10 text-[#00f2fe]">
            <span class="material-symbols-outlined text-[17px]" aria-hidden="true">sports_esports</span>
          </span>
          <span class="truncate text-xs font-medium text-gray-300">Arcade Runner</span>
          <span class="hidden text-[10px] uppercase tracking-wider text-gray-600 md:inline">Three.js</span>
        </div>
        <button class="control-button" id="fullscreen-toggle" type="button" aria-label="Vollbild starten" title="Vollbild starten">
          <span class="material-symbols-outlined text-[18px]" id="fullscreen-icon" aria-hidden="true">fullscreen</span>
          <span class="control-label" id="fullscreen-label">Vollbild</span>
        </button>
      </div>
      <div class="game-stage">
        <iframe id="game-frame" src="highscore_runner.html" title="Pixel Protocol 198X Mini Game" allow="autoplay; fullscreen; gamepad"></iframe>
      </div>
    </section>

    <section class="leaderboard-panel mt-6">
      <div class="leaderboard-header flex items-center justify-between gap-3">
        <div>
          <p class="font-mono text-[10px] uppercase tracking-[0.18em] text-[#00f2fe]">Leaderboard</p>
          <h2 class="mt-1 text-lg text-white">TOP 10</h2>
        </div>
        <span id="mini-leaderboard-status" class="text-[10px] uppercase tracking-[0.14em] text-gray-400">Loading…</span>
      </div>
      <div class="overflow-x-auto">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>#</th>
              <th>PLAYER</th>
              <th>SCORE</th>
              <th>DATE</th>
            </tr>
          </thead>
          <tbody id="mini-leaderboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/mini-game.js"></script>
</body>
</html>
